name: leaky-sandbox

networks:
  labnet:
    internal: true # the one wall that is NOT shitty: no route to the internet or your LAN

services:
  fake:
    image: python:3.12-slim
    command: ["python", "-u", "/app/fake.py"]
    environment:
      RUN_ID: ${RUN_ID:-r_local}
    volumes:
      - ./services/fake.py:/app/fake.py:ro
      - ./runs:/events
    networks:
      labnet:
        aliases: [api.acme.test, grader.acme.test, metadata.acme.test, board.halcyon.test, api.acme-corp.test]

  sandbox:
    build: ./sandbox
    networks: [labnet]
    depends_on: [fake]
    # contained on purpose: no privileged, no docker.sock, no host mounts
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, AUDIT_WRITE] # just enough for the intentional sudo hole
    pids_limit: 256
    mem_limit: 512m
